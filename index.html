<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="theme-color" content="#faf6ed">
  <title>Tob 工作室</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px; background: #faf6ed; color: #34261f; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { text-align: center; }
    h1 { margin: 0 0 16px; font-size: clamp(32px, 7vw, 48px); font-weight: 700; letter-spacing: .02em; }
    p { margin: 0; color: #75665a; font-size: 18px; line-height: 1.8; }
    .accent { display: block; width: 32px; height: 4px; margin: 28px auto 0; border-radius: 4px; background: #e77825; }
  </style>
</head>
<body>
  <main>
    <h1>Tob 工作室</h1>
    <p>网站筹备中</p>
    <span class="accent" aria-hidden="true"></span>

</html>
